name: Security checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=critical
      - run: bunx tsc --noEmit
      - name: Security regression tests
        run: |
          for file in \
            tests/safe-local-path.test.ts \
            tests/security-auth-profile.test.ts \
            tests/profile-public-provenance.test.ts \
            tests/repository-access.test.ts \
            tests/public-visibility.test.ts \
            tests/feature-request-security.test.ts \
            tests/stripe-webhook-config.test.ts \
            tests/stripe-subscription-webhook.test.ts \
            tests/billing-checkout-guard.test.ts \
            tests/checkout-session-reservation.test.ts \
            tests/byok-key-status.test.ts \
            tests/github-webhook-enqueue-retry.test.ts \
            tests/sign-out-installation-link.test.ts \
            tests/analysis-job-store.test.ts \
            tests/gemini-key-routing.test.ts \
            tests/hire-ai-routing.test.ts \
            tests/hire-route-gates.test.ts \
            tests/subscription-entitlement.test.ts \
            tests/cost-calculator.test.ts \
            tests/monthly-quota.test.ts \
            tests/monthly-quota-gates.test.ts \
            tests/paid-ai-rate-limit.test.ts \
            tests/semantic-search-identity.test.ts \
            tests/semantic-search-fallback.test.ts \
            tests/stargazer-perk-access.test.ts \
            tests/stargazer-reservation.test.ts \
            tests/test-session-guard.test.ts \
            tests/trpc-cache-control.test.ts \
            tests/wiki-visibility.test.ts \
            tests/wiki-byok-context.test.ts \
            tests/wiki-viewers-access.test.ts; do
            bun test "$file" || exit 1
          done
